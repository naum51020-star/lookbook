<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VICTOR LOOKBOOK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 단독 페이지용 기본 스타일 (룩북 자체 스타일은 lookbook.js 안에 있음) */
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#fff;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
</head>
<body>

<!-- 카페24 로그인 상태 감지용: 로그인한 경우에만 카페24가 이 모듈을 렌더링합니다 (화면에는 안 보임) -->
<div module="Layout_stateLogon" id="cf24-logon" hidden><span>logon</span></div>

<!-- 룩북 (단독 페이지). 다른 페이지에 넣을 때도 이 div + lookbook.js 두 줄이면 됩니다 -->
<main id="victor-lookbook" data-set-title="1"></main>
<script>
  // lookbook.js 를 새로 올리면 바로 반영되도록 주소에 버전을 붙여서 불러옴 (미리보기는 항상 최신, 사이트는 5분 단위)
  (function () {
    var preview = /[?&]preview=1/.test(location.search);
    var s = document.createElement('script');
    s.src = 'lookbook.js?v=' + (preview ? Date.now() : Math.floor(Date.now() / 300000));
    document.body.appendChild(s);
  })();
</script>

</body>
</html>
